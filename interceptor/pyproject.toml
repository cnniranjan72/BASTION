[project]
name = "bastion-interceptor"
version = "0.0.0"
description = "Latency-critical hot-path service — POST /intercept. ARCHITECTURE.md §2.2, target <50ms p99 overhead."
requires-python = ">=3.11"
dependencies = [
  "bastion-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "redis>=5.2",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "prometheus-client>=0.21",
  "aiokafka>=0.11",
  "aioboto3>=13.2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-asyncpg>=0.48b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv.sources]
bastion-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion_interceptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# See root pyproject.toml's comment: the asyncpg pool is session-scoped
# (conftest.py) so tests and fixtures must share one event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
