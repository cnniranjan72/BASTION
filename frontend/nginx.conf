# Mirrors vite.config.ts's dev proxy rules exactly, so the built static
# site talks to the same two backend services the same way dev mode does.
# __INTERCEPTOR_UPSTREAM__/__AGGREGATOR_UPSTREAM__ are *full base URLs*
# (scheme + host, e.g. http://interceptor:4001 for docker-compose/k8s
# service discovery, or https://bastion-interceptor.onrender.com for
# Render — see docker-entrypoint.sh), not bare hostnames: Render's private
# per-service hostnames turned out not to be resolvable via anything this
# container's default DNS config could reach, so production instead
# targets the same public HTTPS URL a browser would use directly.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # __RESOLVER__ is substituted from /etc/resolv.conf at container start.
    # A literal hostname in proxy_pass is resolved once at nginx startup —
    # if that lookup fails (upstream not ready yet, or this container's
    # resolver doesn't know a platform-specific private hostname), nginx
    # refuses to start at all. Routing proxy_pass through a variable
    # instead defers resolution to request time via this explicit
    # resolver, so a not-yet-ready upstream is a retryable 502, not a boot
    # failure — and it keeps working if the upstream's IP changes later.
    resolver __RESOLVER__ valid=10s;
    # Needed once the upstream is an https:// URL (Render) rather than a
    # plain-HTTP internal service address (docker-compose/k8s) — without
    # it, TLS SNI wouldn't match and upstreams behind name-based routing
    # (Render's edge, most CDNs) would reject or misroute the connection.
    proxy_ssl_server_name on;

    location /api/interceptor/ {
        # set must come before rewrite ... break — ngx_http_rewrite_module
        # runs its directives in the order they appear, and `break` halts
        # that module's remaining directives in this block, so a `set`
        # placed after it silently never executes (the exact bug this
        # order avoids: proxy_pass got called with an empty/uninitialized
        # variable, "invalid URL prefix in http://").
        set $interceptor_upstream __INTERCEPTOR_UPSTREAM__;
        rewrite ^/api/interceptor/(.*)$ /$1 break;
        proxy_pass $interceptor_upstream;
        # $proxy_host (the host:port nginx is actually connecting to), not
        # $host (the Host header the browser sent nginx) — Render's edge
        # and Cloudflare route/authorize by Host header, so forwarding the
        # frontend's own hostname here gets a 403 from the upstream's CDN
        # instead of ever reaching the app. Harmless for docker-compose/k8s,
        # where the internal upstream doesn't inspect Host at all.
        proxy_set_header Host $proxy_host;
    }

    location /api/aggregator/ {
        set $aggregator_upstream __AGGREGATOR_UPSTREAM__;
        rewrite ^/api/aggregator/(.*)$ /$1 break;
        proxy_pass $aggregator_upstream;
        # $proxy_host (the host:port nginx is actually connecting to), not
        # $host (the Host header the browser sent nginx) — Render's edge
        # and Cloudflare route/authorize by Host header, so forwarding the
        # frontend's own hostname here gets a 403 from the upstream's CDN
        # instead of ever reaching the app. Harmless for docker-compose/k8s,
        # where the internal upstream doesn't inspect Host at all.
        proxy_set_header Host $proxy_host;
    }

    location /api/catalog/ {
        # Track 01: agent-readable merchant catalog — standalone service, no
        # governance-core dependency (see catalog/src/bastion_catalog).
        set $catalog_upstream __CATALOG_UPSTREAM__;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_upstream;
        proxy_set_header Host $proxy_host;
    }

    location /ws/live/ {
        set $aggregator_upstream __AGGREGATOR_UPSTREAM__;
        rewrite ^/ws/live/(.*)$ /live/$1 break;
        proxy_pass $aggregator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $proxy_host (the host:port nginx is actually connecting to), not
        # $host (the Host header the browser sent nginx) — Render's edge
        # and Cloudflare route/authorize by Host header, so forwarding the
        # frontend's own hostname here gets a 403 from the upstream's CDN
        # instead of ever reaching the app. Harmless for docker-compose/k8s,
        # where the internal upstream doesn't inspect Host at all.
        proxy_set_header Host $proxy_host;
    }

    # SPA fallback — react-router-dom handles client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
