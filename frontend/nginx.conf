# Mirrors vite.config.ts's dev proxy rules exactly, so the built static
# site talks to the same two backend services the same way dev mode does —
# interceptor and aggregator hostnames come from docker-compose/k8s service
# discovery via env-substituted values (see docker-entrypoint.sh).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/interceptor/ {
        rewrite ^/api/interceptor/(.*)$ /$1 break;
        proxy_pass http://__INTERCEPTOR_UPSTREAM__;
        proxy_set_header Host $host;
    }

    location /api/aggregator/ {
        rewrite ^/api/aggregator/(.*)$ /$1 break;
        proxy_pass http://__AGGREGATOR_UPSTREAM__;
        proxy_set_header Host $host;
    }

    location /ws/live/ {
        rewrite ^/ws/live/(.*)$ /live/$1 break;
        proxy_pass http://__AGGREGATOR_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router-dom handles client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
