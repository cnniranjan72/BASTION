# Mirrors vite.config.ts's dev proxy rules exactly, so the built static
# site talks to the same two backend services the same way dev mode does —
# interceptor and aggregator hostnames come from docker-compose/k8s service
# discovery via env-substituted values (see docker-entrypoint.sh).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # __RESOLVER__ is substituted from /etc/resolv.conf at container start
    # (docker-entrypoint.sh). A literal hostname in proxy_pass is resolved
    # once at nginx startup — if the upstream's DNS record isn't
    # propagated yet (a real race on first boot in orchestrated
    # environments like Render/k8s, where services often start within
    # seconds of each other), nginx refuses to start at all. Routing
    # proxy_pass through a variable instead defers resolution to request
    # time via this explicit resolver, so a not-yet-ready upstream is a
    # retryable 502, not a boot failure — and it keeps working if the
    # upstream's IP changes later (redeploy, restart).
    resolver __RESOLVER__ valid=10s;

    location /api/interceptor/ {
        # set must come before rewrite ... break — ngx_http_rewrite_module
        # runs its directives in the order they appear, and `break` halts
        # that module's remaining directives in this block, so a `set`
        # placed after it silently never executes (the exact bug this
        # order avoids: proxy_pass got called with an empty/uninitialized
        # variable, "invalid URL prefix in http://").
        set $interceptor_upstream __INTERCEPTOR_UPSTREAM__;
        rewrite ^/api/interceptor/(.*)$ /$1 break;
        proxy_pass http://$interceptor_upstream;
        proxy_set_header Host $host;
    }

    location /api/aggregator/ {
        set $aggregator_upstream __AGGREGATOR_UPSTREAM__;
        rewrite ^/api/aggregator/(.*)$ /$1 break;
        proxy_pass http://$aggregator_upstream;
        proxy_set_header Host $host;
    }

    location /ws/live/ {
        set $aggregator_upstream __AGGREGATOR_UPSTREAM__;
        rewrite ^/ws/live/(.*)$ /live/$1 break;
        proxy_pass http://$aggregator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router-dom handles client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
