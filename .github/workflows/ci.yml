name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  python:
    name: Python workspace (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion
          POSTGRES_DB: bastion
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bastion -d bastion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # U3 (v2 upgrade): interceptor/aggregator tests now exercise the real
      # outbox->Kafka->consumer pipeline (aggregator/tests/conftest.py's
      # `_event_pipeline` autouse fixture, plus test_outbox_resumability.py
      # and test_kafka_resumability.py) rather than mocking it — this
      # service needs to be live for those to run at all, matching
      # infra/docker/docker-compose.yml's single-node KRaft setup.
      kafka:
        image: apache/kafka:3.7.0
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
      # U12 (v2 upgrade): the observability milestone test
      # (aggregator/tests/test_observability.py) queries this directly via
      # its REST API. Unlike MinIO, Jaeger's default entrypoint needs no
      # command override, so it works fine as a plain services: entry.
      # Standard ports here (no local-dev-style remap needed) — a fresh CI
      # runner has no pre-existing Jaeger container to collide with.
      jaeger:
        image: jaegertracing/all-in-one:latest
        env:
          COLLECTOR_OTLP_ENABLED: 'true'
        ports: ['16686:16686', '4318:4318']
        options: >-
          --health-cmd "wget -q -O- http://localhost:16686/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bastion:bastion@localhost:5432/bastion
      # U8 (v2 upgrade): the restricted, non-superuser role Row-Level
      # Security tests connect as — see migration 0010 and ADR-009. Created
      # by the migration itself (run under DATABASE_URL's superuser), not
      # provisioned here — this is just the connection string for it.
      APP_DATABASE_URL: postgresql://bastion_app:bastion_app@localhost:5432/bastion
      REDIS_URL: redis://localhost:6379
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      # U9 (v2 upgrade): object storage — see the "Start MinIO" step below
      # for why this isn't a declarative `services:` entry like the others.
      OBJECT_STORAGE_ENDPOINT_URL: http://localhost:9010
      OBJECT_STORAGE_ACCESS_KEY: bastion
      OBJECT_STORAGE_SECRET_KEY: bastion123
      OBJECT_STORAGE_BUCKET: bastion-payloads
      # U12 (v2 upgrade): standard port here, matching the jaeger service
      # above — see its comment for why this differs from local dev's
      # remapped 4319.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      JAEGER_QUERY_URL: http://localhost:16686
      # U17: BYOK LLM credentials (ADR-022) — crypto.py fails closed with
      # no default, so any test touching /llm-keys or /demo/live-run needs
      # this set. A fixed CI-only key, not a secret: nothing encrypted
      # under it outlives the job.
      BYOK_MASTER_KEY: gU1I0XpyRqZsSaXFEjgYod0+6Mu/1773u4z7+fLMkQk=
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.11.30'
          enable-cache: true
      - run: uv python install 3.11
      # --all-extras is required, not optional: each package's own test deps
      # (pytest, httpx, ...) live in [project.optional-dependencies], which
      # --dev alone (root [dependency-groups], ruff/mypy only) does not pull in.
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run python infra/keys/generate_dev_keys.py
      # U9 (v2 upgrade): MinIO needs a `server /data` command argument to
      # actually start in server mode — GitHub Actions' declarative
      # `services:` block (unlike Docker Compose) has no way to override a
      # container's command, only image/env/ports/options. A plain
      # `docker run` step is the standard workaround for this exact,
      # well-known MinIO-on-GitHub-Actions limitation.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9010:9000 -p 9011:9011 \
            -e MINIO_ROOT_USER=bastion \
            -e MINIO_ROOT_PASSWORD=bastion123 \
            minio/minio:latest server /data --console-address :9011
          for i in $(seq 1 30); do
            curl -sf http://localhost:9010/minio/health/live && break
            sleep 1
          done
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy shared/src interceptor/src aggregator/src sdk-python/bastion demo-agent/demo_agent
      # U14's chaos suite (aggregator/tests/chaos/) drives real infra outages via
      # `docker stop`/`docker start` on the literal container names
      # `bastion-kafka`/`bastion-redis` from infra/docker/docker-compose.yml.
      # GitHub Actions' `services:` containers have no such fixed names (and
      # stopping a shared service container mid-job isn't meaningful here
      # anyway) — this suite is real-infra-chaos-local-only by design, run via
      # `uv run pytest aggregator/tests/chaos` against docker-compose, not in CI.
      - run: uv run pytest shared/tests interceptor/tests aggregator/tests sdk-python/tests demo-agent/tests --ignore=aggregator/tests/chaos

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
