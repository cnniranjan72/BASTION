name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  python:
    name: Python workspace (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion
          POSTGRES_DB: bastion
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bastion -d bastion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bastion:bastion@localhost:5432/bastion
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.11.30'
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy shared/src interceptor/src aggregator/src sdk-python/bastion
      - run: uv run pytest shared/tests interceptor/tests aggregator/tests sdk-python/tests

  frontend:
    name: Frontend (placeholder — Phase 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "frontend not yet scaffolded, see BUILD_PLAN.md Phase 7 — nothing to lint/test yet"
