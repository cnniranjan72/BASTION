name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  python:
    name: Python workspace (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion
          POSTGRES_DB: bastion
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bastion -d bastion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bastion:bastion@localhost:5432/bastion
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.11.30'
          enable-cache: true
      - run: uv python install 3.11
      # --all-extras is required, not optional: each package's own test deps
      # (pytest, httpx, ...) live in [project.optional-dependencies], which
      # --dev alone (root [dependency-groups], ruff/mypy only) does not pull in.
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run python infra/keys/generate_dev_keys.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy shared/src interceptor/src aggregator/src sdk-python/bastion demo-agent/demo_agent
      - run: uv run pytest shared/tests interceptor/tests aggregator/tests sdk-python/tests demo-agent/tests

  frontend:
    name: Frontend (typecheck, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
