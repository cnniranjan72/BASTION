name: bastion

# Full local stack (BUILD_PLAN.md Phase 9) — postgres/redis plus every
# BASTION service, all built from the repo root so the interceptor/
# aggregator Dockerfiles can see the whole uv workspace. Run from the repo
# root: `docker compose -f infra/docker/docker-compose.yml up --build`.
#
# For pure backend/frontend dev work against Docker Compose Postgres+Redis
# only (the original, smaller use of this file — services run natively via
# uv run/npm run dev, not containerized), `docker compose -f
# infra/docker/docker-compose.yml up postgres redis` still works exactly as
# before; the app services are additive, not a replacement for that flow.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bastion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bastion
      POSTGRES_PASSWORD: bastion
      POSTGRES_DB: bastion
    ports:
      # Host 5432 is commonly taken by other local projects — map to 5442 instead.
      - '5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bastion -d bastion']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bastion-redis
    restart: unless-stopped
    ports:
      # Host 6379 turned out to collide with a locally-installed native
      # Windows Redis on this machine — same class of issue as Postgres's
      # host-port choice above, just not caught until Phase 9 (see
      # docs/ARCHITECTURE.md §7/§19). Map to 6389 instead.
      - '6389:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Single-node KRaft mode (no ZooKeeper) — U3, v2 upgrade.
    # UPGRADE_ARCHITECTURE.md §4: Postgres stays the durable source of
    # truth (via the transactional outbox), Kafka is distribution/fan-out
    # only. Losing this container loses no data — the outbox catches up
    # once it's back.
    image: apache/kafka:3.7.0
    container_name: bastion-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 15

  minio:
    # S3-compatible object storage — U9, v2 upgrade, UPGRADE_ARCHITECTURE.md
    # §12. Large tool-call payloads (above object_storage_payload_threshold_bytes)
    # get offloaded here; Postgres keeps only a small pointer object. Losing
    # this container loses the large-payload *bodies* (not the events they
    # belong to, which stay durable in Postgres either way) — an accepted,
    # documented risk for local dev, not a design meant for production
    # without real backing storage/replication.
    image: minio/minio:latest
    container_name: bastion-minio
    restart: unless-stopped
    command: server /data --console-address ":9011"
    ports:
      - '9010:9000'   # S3 API
      - '9011:9011'   # web console
    environment:
      MINIO_ROOT_USER: bastion
      MINIO_ROOT_PASSWORD: bastion123
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    # U12, v2 upgrade — UPGRADE_ARCHITECTURE.md §14's OTel trace, distinct
    # from the agent-execution trace_id in DATA_MODEL.md (see docs/adr/ADR-019
    # / tracing.py's module docstring for how the two are correlated without
    # colliding). all-in-one accepts OTLP directly (no separate Collector
    # needed) and serves both the query UI (16686) and its REST query API,
    # which the milestone test hits directly rather than requiring a human
    # to click through the UI.
    image: jaegertracing/all-in-one:latest
    container_name: bastion-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      # Host ports 16686/4318 collided with an unrelated pre-existing
      # Jaeger container already running on this dev machine (a different
      # project) — same class of issue as Postgres's 5432->5442 and
      # Redis's 6379->6389 remaps above. Container-internal ports are
      # untouched (4318 is what Jaeger itself listens on); only the
      # host-side mapping differs.
      - '16687:16686'  # query UI + REST API
      - '4319:4318'    # OTLP HTTP ingestion
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:16686/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: bastion-prometheus
    restart: unless-stopped
    volumes:
      # U13 (v2 upgrade): the whole directory, not just prometheus.yml —
      # alerts.yml (referenced by prometheus.yml's rule_files) needs to be
      # present alongside it inside the container too.
      - ../prometheus:/etc/prometheus:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: bastion-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
    volumes:
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

  generate-keys:
    build:
      context: ../..
      dockerfile: interceptor/Dockerfile
    container_name: bastion-generate-keys
    command: ['python', 'infra/keys/generate_dev_keys.py']
    volumes:
      - jwtkeys:/app/infra/keys
    restart: 'no'

  migrate:
    build:
      context: ../..
      dockerfile: interceptor/Dockerfile
    container_name: bastion-migrate
    command: ['python', 'infra/db/migrate.py']
    environment:
      DATABASE_URL: postgresql://bastion:bastion@postgres:5432/bastion
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  interceptor:
    build:
      context: ../..
      dockerfile: interceptor/Dockerfile
    container_name: bastion-interceptor
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bastion:bastion@postgres:5432/bastion
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /app/infra/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/infra/keys/jwt_public.pem
    ports:
      - '4001:4001'
    volumes:
      - jwtkeys:/app/infra/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      generate-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  aggregator:
    build:
      context: ../..
      dockerfile: aggregator/Dockerfile
    container_name: bastion-aggregator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bastion:bastion@postgres:5432/bastion
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_PATH: /app/infra/keys/jwt_public.pem
    ports:
      - '4002:4002'
    volumes:
      - jwtkeys:/app/infra/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      generate-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4002/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: bastion-frontend
    restart: unless-stopped
    environment:
      INTERCEPTOR_UPSTREAM: http://interceptor:4001
      AGGREGATOR_UPSTREAM: http://aggregator:4002
    ports:
      - '8080:8080'
    depends_on:
      interceptor:
        condition: service_healthy
      aggregator:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
  jwtkeys:
