# TEMPLATE ONLY — never commit real credentials here or anywhere in this
# repo (see .gitignore: *.env, infra/keys/*.pem). To actually deploy:
#
#   kubectl create secret generic bastion-db-redis \
#     --namespace bastion \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host/db?sslmode=require' \
#     --from-literal=REDIS_URL='redis://user:pass@host:6379'
#
#   kubectl create secret generic bastion-jwt-keys \
#     --namespace bastion \
#     --from-file=jwt_private.pem=infra/keys/jwt_private.pem \
#     --from-file=jwt_public.pem=infra/keys/jwt_public.pem
#
# For a real production deployment, DATABASE_URL points at the Neon
# Postgres reserved for exactly this in docs/ARCHITECTURE.md §7 (not the
# Docker Compose Postgres used for local dev/tests), and the JWT keypair
# should be generated once per environment and rotated independently of
# any code deploy — never regenerated by a script that also runs in this
# same deploy, or every rollout would invalidate every existing session.
apiVersion: v1
kind: Secret
metadata:
  name: bastion-db-redis
  namespace: bastion
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://REPLACE_ME:REPLACE_ME@REPLACE_ME/bastion?sslmode=require'
  REDIS_URL: 'redis://REPLACE_ME:REPLACE_ME@REPLACE_ME:6379'
---
apiVersion: v1
kind: Secret
metadata:
  name: bastion-jwt-keys
  namespace: bastion
type: Opaque
stringData:
  jwt_private.pem: |
    REPLACE_ME_WITH_REAL_PEM_CONTENTS
  jwt_public.pem: |
    REPLACE_ME_WITH_REAL_PEM_CONTENTS
