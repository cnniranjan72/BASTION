[project]
name = "bastion-shared"
version = "0.0.0"
description = "Single source of truth for the BASTION wire schema — events, policies, /intercept, errors, realtime messages. ARCHITECTURE.md and DATA_MODEL.md map directly onto these models."
requires-python = ">=3.11"
dependencies = ["pydantic[email]>=2.9", "pyjwt[crypto]>=2.9", "cryptography>=43", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
