[project]
name = "bastion-aggregator"
version = "0.0.0"
description = "Subscribes to the event stream, builds in-memory trace graphs, fans out deltas over WebSocket. ARCHITECTURE.md §2.5."
requires-python = ">=3.11"
dependencies = [
  "bastion-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "redis>=5.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv.sources]
bastion-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
