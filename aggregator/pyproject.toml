[project]
name = "bastion-aggregator"
version = "0.0.0"
description = "Subscribes to the event stream, builds in-memory trace graphs, fans out deltas over WebSocket. ARCHITECTURE.md §2.5."
requires-python = ">=3.11"
dependencies = [
  "bastion-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "redis>=5.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
# bastion-interceptor and bastion-sdk are test-only: the Phase 4 replay
# milestone test is a genuine cross-service integration test (real trace
# data generated through the interceptor's app, replayed through the
# aggregator's, both against the same Postgres) — not a dependency the
# aggregator service itself needs at runtime.
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "bastion-interceptor",
  "bastion-sdk",
  # WS testing on the *same* event loop as the rest of the async test suite
  # (Starlette's own sync TestClient.websocket_connect runs the ASGI app on
  # a separate thread/loop, which would hit the same cross-loop asyncpg
  # issue documented in root pyproject.toml's asyncio_default_fixture_loop_scope
  # comment — the session-scoped db pool is bound to the outer loop).
  "httpx-ws>=0.6",
]

[tool.uv.sources]
bastion-shared = { workspace = true }
bastion-interceptor = { workspace = true }
bastion-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
