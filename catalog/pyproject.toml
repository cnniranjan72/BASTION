[project]
name = "bastion-catalog"
version = "0.0.0"
description = "Track 01 addition: a tiny, agent-readable merchant product catalog (GET /catalog) standing in for a real Razorpay merchant's storefront. Deliberately outside interceptor/aggregator — no governance-core dependency, static data, not part of the audited durability contract."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
